# generate_dockerfile.yaml — 配置文件示例
# 用法: python scripts/generate_dockerfile.py --config generate_dockerfile.yaml
#
# CLI 参数优先级高于此文件，可以随时用命令行覆盖某一项。
# 例如: python scripts/generate_dockerfile.py --config generate_dockerfile.yaml --commit abc123

# ── 必填 ──────────────────────────────────────────────────────────────────────
repo: owner/repo # GitHub 仓库，格式: owner/repo
commit: abc123def456 # git commit SHA（完整或缩写皆可）

# ── 可选：仓库相关 ──────────────────────────────────────────────────────────────
branch: master # 分支名（可选，加速 shallow clone）
# clone_dir: /tmp/myrepo  # 克隆到指定目录（默认使用临时目录）
# no_clone: false         # true = 跳过克隆，直接用 clone_dir 里的内容

# ── 可选：输出相关 ──────────────────────────────────────────────────────────────
# output: output/my.Dockerfile          # 输出 Dockerfile 路径（默认自动命名）
# template: combine.Dockerfile.j2       # Jinja2 模板路径
# base_image_registry: docker.io/myorg  # 基础镜像的 registry 前缀
base_image_tag_suffix: _base # 与 scripts/build_base_images.py 默认行为一致
ensure_base_image: true # 本地缺少基础镜像时自动从 base_dockerfiles 构建

# ── 可选：LLM 相关 ──────────────────────────────────────────────────────────────
model: gpt-4o # 模型名称
# api_key: sk-...         # API Key（建议用环境变量 OPENAI_API_KEY 代替）
# api_base: https://api.openai.com/v1  # 自定义 API 地址（兼容 OpenAI 协议的服务）

# ── 可选：调试 ─────────────────────────────────────────────────────────────────
# dry_run: false          # true = 只打印 LLM 提示词，不实际调用
