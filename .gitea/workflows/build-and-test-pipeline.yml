name: Build and Test Pipeline

on:
  workflow_dispatch:
    inputs:
      jsonl:
        description: Path to the input JSONL file on the runner
        required: true
        default: /data/inputs/319_commands.jsonl
      output_dir:
        description: Directory for generated Dockerfiles
        required: true
        default: /data/outputs/dockerfiles
      results_dir:
        description: Directory for test results
        required: true
        default: /data/outputs/results
      template:
        description: Jinja2 template path (relative to repo)
        required: true
        default: combine.Dockerfile.j2
      shards:
        description: Number of JSONL shards (for future multi-node, currently sequential)
        required: true
        default: "4"
      workers_per_shard:
        description: Parallel workers within each shard (1 = sequential)
        required: false
        default: "1"
      base_image_registry:
        description: Registry prefix for base images
        required: false
        default: ""
      base_image_tag_suffix:
        description: Suffix appended to base image tags
        required: true
        default: _base
      timeout_build:
        description: Build timeout per image (seconds)
        required: false
        default: "1800"
      timeout_test:
        description: Test timeout per image (seconds)
        required: false
        default: "1800"
      dry_run:
        description: Validate only, do not write files
        required: true
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      JSONL: ${{ github.event.inputs.jsonl }}
      OUTPUT_DIR: ${{ github.event.inputs.output_dir }}
      RESULTS_DIR: ${{ github.event.inputs.results_dir }}
      TEMPLATE: ${{ github.event.inputs.template }}
      SHARDS: ${{ github.event.inputs.shards }}
      WORKERS: ${{ github.event.inputs.workers_per_shard }}
      BASE_IMAGE_REGISTRY: ${{ github.event.inputs.base_image_registry }}
      BASE_IMAGE_TAG_SUFFIX: ${{ github.event.inputs.base_image_tag_suffix }}
      TIMEOUT_BUILD: ${{ github.event.inputs.timeout_build }}
      TIMEOUT_TEST: ${{ github.event.inputs.timeout_test }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - name: Check out repository
        uses: https://gitea.com/actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$JSONL" ]; then
            echo "JSONL file not found: $JSONL"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      # --- Stage 1: Generate Dockerfiles ---
      - name: Generate Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate

          ARGS=(
            scripts/batch_generate_dockerfiles.py
            --jsonl "$JSONL"
            --output-dir "$OUTPUT_DIR"
            --template "$TEMPLATE"
            --workers 4
            --base-image-tag-suffix "$BASE_IMAGE_TAG_SUFFIX"
            --summary "$RESULTS_DIR/generate-summary.json"
          )

          if [ -n "$BASE_IMAGE_REGISTRY" ]; then
            ARGS+=(--base-image-registry "$BASE_IMAGE_REGISTRY")
          fi

          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          python "${ARGS[@]}"

      # --- Stage 2: Split JSONL into shards ---
      - name: Split JSONL into shards
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          mkdir -p "$RESULTS_DIR/shards"
          python scripts/split_jsonl.py \
            --jsonl "$JSONL" \
            --shards "$SHARDS" \
            --output-dir "$RESULTS_DIR/shards"
          echo "Shards created:"
          ls -la "$RESULTS_DIR/shards/"

      # --- Stage 3: Build + Test each shard ---
      - name: Build and test all shards
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate

          shard_count=$SHARDS
          # Clamp to actual shard files present
          actual=$(ls "$RESULTS_DIR/shards"/shard_*.jsonl 2>/dev/null | wc -l)
          if [ "$actual" -lt "$shard_count" ]; then
            shard_count=$actual
          fi

          echo "Running $shard_count shard(s) sequentially ..."
          echo ""

          overall_exit=0

          for i in $(seq 0 $(( shard_count - 1 ))); do
            SHARD_JSONL="$RESULTS_DIR/shards/shard_${i}.jsonl"
            SHARD_RESULT="$RESULTS_DIR/shard_${i}.results.jsonl"

            echo "==============================="
            echo "Shard $i / $(( shard_count - 1 ))"
            echo "  Input:       $SHARD_JSONL"
            echo "  Dockerfiles: $OUTPUT_DIR"
            echo "  Output:      $SHARD_RESULT"
            echo "==============================="

            python scripts/run_shard_tests.py \
              --jsonl "$SHARD_JSONL" \
              --dockerfile-dir "$OUTPUT_DIR" \
              --output "$SHARD_RESULT" \
              --timeout-build "$TIMEOUT_BUILD" \
              --timeout-test "$TIMEOUT_TEST" \
              --workers "$WORKERS" || overall_exit=1

            echo ""
          done

          exit $overall_exit

      # --- Stage 4: Merge results ---
      - name: Merge results
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          MERGED="$RESULTS_DIR/all-results.jsonl"
          > "$MERGED"

          total=0
          passed=0
          failed=0

          for f in "$RESULTS_DIR"/shard_*.results.jsonl; do
            if [ -f "$f" ]; then
              cat "$f" >> "$MERGED"
              shard_total=$(wc -l < "$f")
              shard_passed=$(grep -c '"status": "passed"' "$f" || true)
              shard_failed=$(( shard_total - shard_passed ))
              echo "$(basename "$f"): $shard_passed passed, $shard_failed failed (total $shard_total)"
              total=$(( total + shard_total ))
              passed=$(( passed + shard_passed ))
              failed=$(( failed + shard_failed ))
            fi
          done

          echo ""
          echo "==============================="
          echo "Total:  $total"
          echo "Passed: $passed"
          echo "Failed: $failed"
          echo "==============================="

          cat > "$RESULTS_DIR/test-summary.json" <<SUMMARY_EOF
          {
            "total": $total,
            "passed": $passed,
            "failed": $failed,
            "merged_results": "$MERGED"
          }
          SUMMARY_EOF

          echo "Results: $MERGED"
          echo "Summary: $RESULTS_DIR/test-summary.json"
