name: Build and Test Pipeline

on:
  workflow_dispatch:
    inputs:
      jsonl:
        description: Path to the input JSONL file on the runner
        required: true
        default: /data/inputs/319_commands.jsonl
      output_dir:
        description: Directory for generated Dockerfiles
        required: true
        default: /data/outputs/dockerfiles
      results_dir:
        description: Directory for test results
        required: true
        default: /data/outputs/results
      template:
        description: Jinja2 template path (relative to repo)
        required: true
        default: combine.Dockerfile.j2
      shards:
        description: Number of parallel test shards
        required: true
        default: "4"
      workers_per_shard:
        description: Parallel workers within each shard (1 = sequential)
        required: false
        default: "1"
      base_image_registry:
        description: Registry prefix for base images
        required: false
        default: ""
      base_image_tag_suffix:
        description: Suffix appended to base image tags
        required: true
        default: _base
      timeout_build:
        description: Build timeout per image (seconds)
        required: false
        default: "1800"
      timeout_test:
        description: Test timeout per image (seconds)
        required: false
        default: "1800"
      dry_run:
        description: Validate only, do not write files
        required: true
        type: boolean
        default: false

# ---------------------------------------------------------------
#  Stage 1: generate Dockerfiles + split JSONL into shards
# ---------------------------------------------------------------
jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    env:
      JSONL: ${{ github.event.inputs.jsonl }}
      OUTPUT_DIR: ${{ github.event.inputs.output_dir }}
      RESULTS_DIR: ${{ github.event.inputs.results_dir }}
      TEMPLATE: ${{ github.event.inputs.template }}
      SHARDS: ${{ github.event.inputs.shards }}
      BASE_IMAGE_REGISTRY: ${{ github.event.inputs.base_image_registry }}
      BASE_IMAGE_TAG_SUFFIX: ${{ github.event.inputs.base_image_tag_suffix }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - name: Check out repository
        uses: https://gitea.com/actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$JSONL" ]; then
            echo "JSONL file not found: $JSONL"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Generate Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate

          ARGS=(
            scripts/batch_generate_dockerfiles.py
            --jsonl "$JSONL"
            --output-dir "$OUTPUT_DIR"
            --template "$TEMPLATE"
            --workers 4
            --base-image-tag-suffix "$BASE_IMAGE_TAG_SUFFIX"
            --summary "$RESULTS_DIR/generate-summary.json"
          )

          if [ -n "$BASE_IMAGE_REGISTRY" ]; then
            ARGS+=(--base-image-registry "$BASE_IMAGE_REGISTRY")
          fi

          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          python "${ARGS[@]}"

      - name: Split JSONL into shards
        id: split
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          mkdir -p "$RESULTS_DIR/shards"
          MATRIX=$(python scripts/split_jsonl.py \
            --jsonl "$JSONL" \
            --shards "$SHARDS" \
            --output-dir "$RESULTS_DIR/shards")
          echo "matrix={\"shard\":$MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Shard matrix: $MATRIX"

  # ---------------------------------------------------------------
  #  Stage 2: build + test each shard in parallel
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: generate
    if: ${{ github.event.inputs.dry_run != 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate.outputs.matrix) }}
    env:
      OUTPUT_DIR: ${{ github.event.inputs.output_dir }}
      RESULTS_DIR: ${{ github.event.inputs.results_dir }}
      WORKERS: ${{ github.event.inputs.workers_per_shard }}
      TIMEOUT_BUILD: ${{ github.event.inputs.timeout_build }}
      TIMEOUT_TEST: ${{ github.event.inputs.timeout_test }}
    steps:
      - name: Check out repository
        uses: https://gitea.com/actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate

          SHARD_JSONL="$RESULTS_DIR/shards/shard_${{ matrix.shard }}.jsonl"
          SHARD_RESULT="$RESULTS_DIR/shard_${{ matrix.shard }}.results.jsonl"

          echo "Processing shard ${{ matrix.shard }}"
          echo "Input: $SHARD_JSONL"
          echo "Dockerfiles: $OUTPUT_DIR"
          echo "Output: $SHARD_RESULT"

          python scripts/run_shard_tests.py \
            --jsonl "$SHARD_JSONL" \
            --dockerfile-dir "$OUTPUT_DIR" \
            --output "$SHARD_RESULT" \
            --timeout-build "$TIMEOUT_BUILD" \
            --timeout-test "$TIMEOUT_TEST" \
            --workers "$WORKERS"

  # ---------------------------------------------------------------
  #  Stage 3: collect and merge all shard results
  # ---------------------------------------------------------------
  collect:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && github.event.inputs.dry_run != 'true' }}
    env:
      RESULTS_DIR: ${{ github.event.inputs.results_dir }}
      SHARDS: ${{ github.event.inputs.shards }}
    steps:
      - name: Merge shard results
        shell: bash
        run: |
          set -euo pipefail

          MERGED="$RESULTS_DIR/all-results.jsonl"
          > "$MERGED"

          total=0
          passed=0
          failed=0

          for i in $(seq 0 $(( SHARDS - 1 ))); do
            SHARD_FILE="$RESULTS_DIR/shard_${i}.results.jsonl"
            if [ -f "$SHARD_FILE" ]; then
              cat "$SHARD_FILE" >> "$MERGED"
              shard_total=$(wc -l < "$SHARD_FILE")
              shard_passed=$(grep -c '"status": "passed"' "$SHARD_FILE" || true)
              shard_failed=$(( shard_total - shard_passed ))
              echo "Shard $i: $shard_passed passed, $shard_failed failed (total $shard_total)"
              total=$(( total + shard_total ))
              passed=$(( passed + shard_passed ))
              failed=$(( failed + shard_failed ))
            else
              echo "Shard $i: result file missing ($SHARD_FILE)"
            fi
          done

          echo ""
          echo "==============================="
          echo "Total:  $total"
          echo "Passed: $passed"
          echo "Failed: $failed"
          echo "==============================="

          # Write summary JSON
          cat > "$RESULTS_DIR/test-summary.json" <<EOF
          {
            "total": $total,
            "passed": $passed,
            "failed": $failed,
            "shards": $SHARDS,
            "merged_results": "$MERGED"
          }
          EOF

          echo "Results merged to: $MERGED"
          echo "Summary written to: $RESULTS_DIR/test-summary.json"
